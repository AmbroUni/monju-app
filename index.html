    await M.save();
    await M.kvDel('data-previous');
    history.replaceState({ depth: 0 }, '', '#/boas-vindas');
    M.render();
  },
});

// ---------- Privacidade e instalação ----------
M.renderPrivacy = () => `${M.h.header('Privacidade e instalação')}
  <div class="pad prose">
    <h2>Onde ficam os dados</h2>
    <p>Tudo fica guardado só neste iPhone, no armazenamento do Monju dentro do Safari. Não há conta, servidor ou nuvem. Ninguém além de quem usa este iPhone vê os registros.</p>
    <h2>O que sai do iPhone</h2>
    <p>Só a foto da refeição, e só quando a análise por foto está ligada e autorizada. Ela vai para a Anthropic para estimar os alimentos. O backup é um arquivo que você mesma salva onde quiser.</p>
    <h2>Instalar na tela de início</h2>
    <ol><li>Abra o endereço do Monju no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> ${M.icon('share', 'inline')}.</li><li>Escolha <b>Adicionar à Tela de Início</b> e confirme.</li></ol>
    <p>Depois, abra sempre pelo ícone do Monju. Ele funciona sem internet.</p>
    ${M.standalone ? M.h.banner('ok', 'check', 'O Monju está instalado na tela de início.') : M.h.banner('warn', 'info', 'Você está usando o Monju dentro do Safari. Instale na tela de início para os dados ficarem guardados com segurança.')}
    <h2>Avisos</h2>
    <p>O Monju é um diário. Ele não recomenda doses, não diagnostica e não substitui orientação médica. Calorias são estimativas.</p>
  </div>`;

// ---------- Resumo para consulta ----------
M.renderReport = (params, q) => {
  const days = { '30': 30, '60': 60, '90': 90 }[q.dias] || 30;
  const to = M.Day.today();
  const from = M.Day.add(to, -days + 1);
  const p = M.data.profile || {};
  const doses = M.data.doses.filter((d) => d.day >= from).sort((a, b) => a.takenAt.localeCompare(b.takenAt));
  const ws = M.data.weights.filter((w) => w.day >= from).sort((a, b) => a.day.localeCompare(b.day));
  const wb = M.data.wellbeing.filter((w) => w.day >= from);
  const symptoms = {};
  wb.forEach((w) => (w.symptoms || []).forEach((s) => (symptoms[s] = (symptoms[s] || 0) + 1)));
  const ms = M.data.measurements.filter((m) => m.day >= from).sort((a, b) => a.day.localeCompare(b.day));
  const meals = M.data.meals.filter((m) => m.day >= from);
  const mealDays = new Set(meals.map((m) => m.day)).size;
  const occ = M.occurrences(M.data.schedules, from, to).filter((o) => M.occurrenceStatus(o, M.data.doses).kind === 'noRecord');
  return `${M.h.header('Resumo para consulta', { action: `<button class="bar-btn text" data-act="print" id="printButton">Imprimir</button>` })}
  <div class="pad">
    <div class="segmented no-print">${[['30', '30 dias'], ['60', '60 dias'], ['90', '90 dias']].map(([k, l]) => `<button class="${+k === days ? 'on' : ''}" data-act="go" data-to="/perfil/resumo?dias=${k}" data-replace="1">${l}</button>`).join('')}</div>
    <article class="report card">
      <h2>Resumo · ${ec(p.name || '')}</h2>
      <p class="muted">${M.dayFull(from)} a ${M.dayFull(to)} · gerado pelo Monju (diário pessoal)</p>
      <h3>Aplicações (${doses.length})</h3>
      ${doses.length ? `<table><thead><tr><th>Data</th><th>Dose</th><th>Local</th></tr></thead><tbody>${doses.map((d) => `<tr><td>${M.dayShort(d.day)} ${M.time(d.takenAt)}</td><td>${M.mg(d.doseMg)} ${ec(d.medication)}</td><td>${d.site ? M.SITES[d.site][1] : '—'}</td></tr>`).join('')}</tbody></table>` : '<p>Nenhuma registrada.</p>'}
      ${occ.length ? `<p class="muted">Lembretes sem registro: ${occ.map((o) => M.dayShort(o.day)).join(', ')}.</p>` : ''}
      <h3>Peso</h3>
      ${ws.length ? `<p>${M.kg(ws[0].kg)} (${M.dayShort(ws[0].day)}) → ${M.kg(ws[ws.length - 1].kg)} (${M.dayShort(ws[ws.length - 1].day)})${ws.length > 1 ? ` · variação ${(ws[ws.length - 1].kg - ws[0].kg > 0 ? '+' : '') + M.num(ws[ws.length - 1].kg - ws[0].kg, 1)} kg` : ''} · ${ws.length} pesagens</p>${ws.length >= 2 ? M.weightChart(ws, doses, null) : ''}` : '<p>Sem registros.</p>'}
      ${ms.length ? `<h3>Medidas</h3><table><thead><tr><th>Data</th>${Object.keys(M.MEASURES).filter((k) => ms.some((m) => m.valuesCm[k] != null)).map((k) => `<th>${M.MEASURES[k]}</th>`).join('')}</tr></thead><tbody>${ms.map((m) => `<tr><td>${M.dayShort(m.day)}</td>${Object.keys(M.MEASURES).filter((k) => ms.some((x) => x.valuesCm[k] != null)).map((k) => `<td>${m.valuesCm[k] != null ? M.num(m.valuesCm[k], 1) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table>` : ''}
      <h3>Sintomas relatados</h3>
      ${Object.keys(symptoms).length ? `<ul>${Object.entries(symptoms).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<li>${ec(s)}: ${n} ${n === 1 ? 'vez' : 'vezes'}</li>`).join('')}</ul>` : '<p>Nenhum sintoma marcado.</p>'}
      <h3>Alimentação</h3>
      <p>${mealDays ? `Refeições registradas em ${mealDays} dias; média estimada de ${M.num(Math.round(meals.reduce((s, m) => s + M.mealKcal(m), 0) / mealDays), 0)} kcal por dia registrado (estimativa).` : 'Sem refeições registradas.'}</p>
      <p class="muted small">Informações registradas pela própria usuária. Calorias são estimativas.</p>
    </article>
  </div>`;
};
M.actions.print = () => window.print();

})();
/* ---- app.js ---- */
(() => {
'use strict';
/* Monju — rotas e inicialização. */

M.VERSION = '1.0.0';
M.standalone = !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));

const r = M.route;
r('/boas-vindas', { render: M.renderWelcome, cls: 'welcome-screen', title: 'Boas-vindas' });
r('/hoje', { tab: 'hoje', render: M.renderToday, title: 'Hoje', cls: 'today-screen' });
r('/calendario', { tab: 'calendario', render: M.renderCalendar, title: 'Calendário' });
r('/evolucao', { tab: 'evolucao', render: M.renderEvolution, title: 'Evolução' });
r('/perfil', { tab: 'perfil', render: M.renderProfile, title: 'Perfil' });

r('/aplicacao/nova', { render: M.renderDoseForm, parent: '/hoje', title: 'Registrar aplicação' });
r('/aplicacao/:id', { render: M.renderDoseForm, parent: '/aplicacoes', title: 'Aplicação' });
r('/aplicacoes', { render: M.renderDoseHistory, parent: '/perfil', title: 'Histórico de aplicações' });
r('/lembretes', { render: M.renderSchedules, parent: '/perfil', title: 'Lembretes' });
r('/lembretes/novo', { render: M.renderScheduleForm, mount: M.mountShowIf, parent: '/lembretes', title: 'Novo lembrete' });
r('/lembretes/:id', { render: M.renderScheduleForm, mount: M.mountShowIf, parent: '/lembretes', title: 'Lembrete' });
r('/peso/novo', { render: M.renderWeightForm, parent: '/hoje', title: 'Peso', mount: (root) => setTimeout(() => root.querySelector('#weightInput')?.focus(), 80) });
r('/peso/:id', { render: M.renderWeightForm, parent: '/evolucao', title: 'Peso' });
r('/medidas/novo', { render: M.renderMeasureForm, parent: '/hoje', title: 'Medidas' });
r('/medidas/:id', { render: M.renderMeasureForm, parent: '/evolucao', title: 'Medidas' });
r('/bem-estar/novo', { render: M.renderWellbeingForm, parent: '/hoje', title: 'Bem-estar' });
r('/bem-estar/:id', { render: M.renderWellbeingForm, parent: '/hoje', title: 'Bem-estar' });
r('/atividade/nova', { render: M.renderActivityForm, parent: '/hoje', title: 'Atividade' });
r('/atividade/:id', { render: M.renderActivityForm, parent: '/hoje', title: 'Atividade' });
r('/foto-corpo/nova', { render: M.renderBodyPhotoForm, parent: '/evolucao', title: 'Foto de acompanhamento' });
r('/foto-corpo/:id', { render: M.renderBodyPhotoForm, parent: '/evolucao', title: 'Foto de acompanhamento' });

r('/refeicao/revisar', { render: M.renderMealReview, mount: M.mountMealReview, parent: '/hoje', title: 'Revisar refeição' });
r('/refeicao/revisar/adicionar', { render: M.renderFoodPicker, mount: M.mountFoodPicker, parent: '/refeicao/revisar', title: 'Adicionar alimento' });
r('/refeicao/revisar/outro', { render: M.renderCustomFood, parent: '/refeicao/revisar', title: 'Outro alimento' });
r('/refeicao/revisar/item/:itemId', { render: M.renderItemEditor, mount: M.mountItemEditor, parent: '/refeicao/revisar', title: 'Alimento' });
r('/refeicao/:id', { render: M.renderMealDetail, parent: '/hoje', title: 'Refeição' });

r('/dia/:day', { render: M.renderDay, parent: '/calendario', title: 'Dia' });
r('/evolucao/comparar', { render: M.renderCompare, mount: M.mountCompare, parent: '/evolucao', title: 'Comparar fotos' });

r('/perfil/editar', { render: M.renderProfileEdit, parent: '/perfil', title: 'Editar perfil' });
r('/perfil/analise', { render: M.renderAISettings, parent: '/perfil', title: 'Análise por foto' });
r('/perfil/backup', { render: M.renderBackup, parent: '/perfil', title: 'Backup' });
r('/perfil/privacidade', { render: M.renderPrivacy, parent: '/perfil', title: 'Privacidade' });
r('/perfil/resumo', { render: M.renderReport, parent: '/perfil', title: 'Resumo para consulta', cls: 'report-screen' });

/** Remove fotos que não pertencem a nenhum registro (ex.: foto escolhida e não salva). */
M.collectGarbage = async () => {
  try {
    const used = new Set([...M.data.meals.map((m) => m.photoID), ...M.data.bodyPhotos.map((p) => p.photoID), M.data.mealDraft && M.data.mealDraft.photoID].filter(Boolean));
    for (const k of await M.photoKeys()) if (!used.has(k)) await M.photoDelete(k);
  } catch (e) {}
};

M.boot = async () => {
  M.loadFoods(M.FOODS || []);
  await M.load();
  try {
    M.apiKey = (await M.kvGet('apiKey')) || null;
  } catch (e) {
    M.apiKey = null;
  }
  if (!M.data.profile) history.replaceState({ depth: 0 }, '', '#/boas-vindas');
  else {
    if (!location.hash || location.hash === '#/' || location.hash.startsWith('#/boas-vindas')) history.replaceState({ depth: 0 }, '', '#/hoje');
    else history.replaceState({ depth: 0 }, '', location.hash);
  }
  // Testes e demonstração: ?demo=1 abre com dados fictícios.
  const params = new URLSearchParams(location.search);
  if (params.get('demo') === '1' && !M.data.profile) {
    M.data = await M.buildDemoData();
    await M.save();
    history.replaceState({ depth: 0 }, '', '#/hoje');
  }
  if (params.get('falhas')) M.AI.demoFailures = parseInt(params.get('falhas'), 10) || 0;
  document.documentElement.classList.toggle('standalone', M.standalone);
  if (!M.storageOK) setTimeout(() => M.toast('O Safari não liberou armazenamento: os dados não ficarão salvos.', 'error'), 500);
  M.render();
  M.collectGarbage();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !params.has('nosw')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Ao voltar para o app (vindo de outro app), atualiza datas como "hoje".
  let lastDay = M.Day.today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && M.Day.today() !== lastDay) {
      lastDay = M.Day.today();
      M.refresh();
    }
  });
  window.__monjuReady = true;
};
document.addEventListener('DOMContentLoaded', M.boot);

})();
</script>
</body>
</html>
